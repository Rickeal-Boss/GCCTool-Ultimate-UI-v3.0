name: Build Windows EXE

on:
  push:
    # fix：本项目的修复分支也需要自动编译验证，否则推 fix 不会触发构建，
    # 只能靠 Actions 页面手动 dispatch，容易漏检。
    branches: [ main, master, develop, fix ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Tidy and download dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Run tests
        # 核心逻辑（课程类型映射、选课结果解析、空结果语义、日志脱敏、课表缓存）
        # 都有单元测试，先把问题挡在构建之前。
        # go test ./... 同时会对 internal/ui 与根包做一次编译，等价于全量类型检查。
        env:
          CGO_ENABLED: 1
        run: go test ./...

      - name: Build Windows EXE
        env:
          CGO_ENABLED: 1
        run: |
          go build -v -tags prod -ldflags="-s -w -H windowsgui" -o gcc_helper.exe .
          go build -v -ldflags="-s -w" -o gcc_helper_debug.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-helper-windows-exe
          path: |
            gcc_helper.exe
            gcc_helper_debug.exe
          retention-days: 30

      - name: Display build info
        run: |
          Write-Host "Build completed successfully!"
          Write-Host "EXE size: $([math]::Round((Get-Item gcc_helper.exe).Length / 1KB, 2)) KB"
          Write-Host "Debug EXE size: $([math]::Round((Get-Item gcc_helper_debug.exe).Length / 1KB, 2)) KB"
