name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows amd64
          - runner: windows-latest
            os: windows
            arch: amd64
            goos: windows
            goarch: amd64
            output: gcc_helper.exe
            output_debug: gcc_helper_debug.exe
            ldflags: "-s -w -H windowsgui"
            cgo: "1"

          # macOS Intel (amd64) — macos-13 (Intel runner) 已进入退役、排队数十分钟不分配，
          # 改为在 arm64 runner 上交叉编译（Fyne 官方支持的 clang -arch x86_64 方式，
          # 见下方 "Configure cross-compile" 步骤写入 CC/CGO_CFLAGS/CGO_LDFLAGS）。
          - runner: macos-latest
            os: macos
            arch: amd64
            goos: darwin
            goarch: amd64
            output: gcc_helper
            output_debug: gcc_helper_debug
            ldflags: "-s -w"
            cgo: "1"

          # macOS Apple Silicon (arm64)
          - runner: macos-latest
            os: macos
            arch: arm64
            goos: darwin
            goarch: arm64
            output: gcc_helper_arm64
            output_debug: gcc_helper_debug_arm64
            ldflags: "-s -w"
            cgo: "1"

          # Linux amd64 — Fyne 是 CGO GUI 框架，必须 CGO_ENABLED=1 + 安装 GL/X11 开发库，
          # 否则 go-gl 的 C 文件被 build constraints 排除，构建必失败（历史 v* 标签因此从没出过 Linux 包）
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            goos: linux
            goarch: amd64
            output: gcc_helper_linux
            output_debug: gcc_helper_debug_linux
            ldflags: "-s -w"
            cgo: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goarch }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.goarch }}-

      - name: Tidy and download dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      # ------------------------------------------------------------------ macOS
      # Fyne CGO 在 macOS 上需要：
      #   1. Xcode Command Line Tools（runner 已预装）
      #   2. pkg-config（用于查找系统库）
      #   3. glfw（OpenGL 窗口库，Fyne 通过 CGO 链接）
      # 两个 macOS runner（amd64/arm64）共用同一步骤
      # ------------------------------------------------------------------ macOS
      - name: Install macOS build dependencies (Fyne CGO)
        if: matrix.goos == 'darwin'
        run: |
          brew update --preinstall || true
          brew install pkg-config || true
          # 确认 Xcode CLT 可用
          xcode-select --print-path || xcode-select --install || true

      # macOS Intel 交叉编译：在 arm64 runner 上产出 x86_64 二进制
      # （Fyne/go-gl 的 C 代码由 clang 按 -arch 重新编译，需同时给 CFAGS/LDFLAGS）
      - name: Configure cross-compile (macOS Intel on arm64 runner)
        if: matrix.goos == 'darwin' && matrix.arch == 'amd64'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-arch x86_64" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-arch x86_64" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ Linux
      # Fyne 在 Linux 上通过 CGO 链接 OpenGL/X11 —— 必须安装开发库，
      # 否则构建报 "build constraints exclude all Go files"（go-gl）。
      # ------------------------------------------------------------------ Linux
      - name: Install Linux build dependencies (Fyne CGO)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            xorg-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -v -tags prod -ldflags="${{ matrix.ldflags }}" -o ${{ matrix.output }} .

      - name: Build debug binary (with console)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -v -ldflags="-s -w" -o ${{ matrix.output_debug }} .

      - name: Create release archive
        shell: bash
        run: |
          ARCHIVE_DIR="$(pwd)/release"
          mkdir -p "$ARCHIVE_DIR"
          cp "${{ matrix.output }}"       "$ARCHIVE_DIR/"
          cp "${{ matrix.output_debug }}" "$ARCHIVE_DIR/"
          cp README.md "$ARCHIVE_DIR/" || true

          ARCHIVE_NAME="gcc_helper_${{ matrix.goos }}_${{ matrix.arch }}"

          # ⚠️ Windows runner 的 bash 是 Git Bash，**不自带 zip**（旧写法 exit 127）。
          # 用 runner 预装的 7-Zip 打包；macOS/Linux 用 tar（两者都自带）。
          if [ "${{ matrix.goos }}" = "windows" ]; then
            SEVEN_ZIP="/c/Program Files/7-Zip/7z.exe"
            [ -x "$SEVEN_ZIP" ] || SEVEN_ZIP="7z"
            "$SEVEN_ZIP" a -tzip "${ARCHIVE_NAME}.zip" "$ARCHIVE_DIR/*" >/dev/null
            ls -l "${ARCHIVE_NAME}.zip"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" -C "$ARCHIVE_DIR" .
            ls -l "${ARCHIVE_NAME}.tar.gz"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-helper-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            gcc_helper_${{ matrix.goos }}_${{ matrix.arch }}.*
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    # 任一平台构建失败也不阻塞发布：用已有产物建 Release（下载不到产物会自然失败，
    # 不会产生空 Release）。避免"一个平台挂了 → 整包发不出去"。
    if: always() && startsWith(github.ref, 'refs/tags/')
    # 仓库默认 workflow token 为只读（default_workflow_permissions=read），
    # 不显式声明该 job 会因 403 无法创建 Release。这里只为发布 job 升权，
    # 构建 job 保持默认只读（最小权限）。
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -lR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## GCC选课助手

            ### 📦 下载

            选择适合你操作系统的版本：

            - **Windows**: `gcc_helper_windows_amd64.zip`
            - **macOS (Intel)**: `gcc_helper_darwin_amd64.tar.gz`
            - **macOS (Apple Silicon / M系列)**: `gcc_helper_darwin_arm64.tar.gz`
            - **Linux**: `gcc_helper_linux_amd64.tar.gz`

            ### 📋 使用说明

            1. 下载并解压对应平台的压缩包
            2. 运行程序：
               - Windows: 双击 `gcc_helper.exe`
               - macOS/Linux: 在终端运行 `./gcc_helper`
            3. 详细使用说明请查看仓库根目录的 `README.md`

            ### 🐛 Debug版本

            每个平台都提供了 debug 版本（带控制台输出），用于故障排查：
            - Windows: `gcc_helper_debug.exe`
            - macOS (Intel): `gcc_helper_debug`
            - macOS (ARM): `gcc_helper_debug_arm64`
            - Linux: `gcc_helper_debug_linux`

            ### ⚠️ 注意事项

            - Windows 版本需要 VC++ Runtime 支持
            - macOS 首次运行需在「系统设置 → 隐私与安全性」允许运行
            - 遇到问题请查看 README.md 的故障排除部分

            ### 📝 更新日志

            本次更新内容见下方自动生成的变更记录（Commits）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
